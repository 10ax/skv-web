# Deterministic checks for every push and pull request.
#
# This workflow only verifies; it never publishes. Deployment to GitHub Pages is
# the separate nextjs.yml workflow, which runs on pushes to main.
#
# The checks live in 10ax/ci-common (tag v1, node.yml): pnpm from package.json
# "packageManager", Node from .node-version. Warnings, not gates.
name: CI

on:
  push:
  pull_request:

# One run per ref. A new push supersedes the one still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: 10ax/ci-common/.github/workflows/node.yml@v1
    with:
      typecheck: pnpm run build-types
