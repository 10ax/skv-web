# Deterministic checks for every push and pull request.
#
# This workflow only verifies; it never publishes. Deployment to GitHub Pages is
# the separate nextjs.yml workflow, which runs on pushes to main.
#
# Versions come from the repo, not from this file: pnpm from package.json
# "packageManager" (read by pnpm/action-setup) and Node from .node-version.
name: CI

on:
  push:
  pull_request:

# One run per ref. A new push supersedes the one still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No "version" input: pnpm/action-setup reads package.json → packageManager
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts keeps the "prepare" script (husky install) from
        # installing git hooks into a runner that will never commit.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run build-types

      - name: Test
        run: pnpm exec vitest run

      - name: Build static export
        run: pnpm run build
